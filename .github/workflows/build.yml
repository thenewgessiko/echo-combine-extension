name: MAIN build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Verify
        run: |
          bash .github/scripts/test-release-metadata.sh
          node .github/scripts/test-autoassign.mjs
          bash ./gradlew :ext:check --no-daemon

      - name: Prepare release metadata
        env:
          BUILD_BRANCH: main
        run: bash .github/scripts/prepare-release.sh

      - name: Build extension
        run: |
          bash ./gradlew :app:assembleDebug --no-daemon \
            "-PextVersionName=$VERSION" \
            "-PextName=$EXT_NAME" \
            "-PextUpdateUrl=$UPDATE_URL"
          cp app/build/outputs/apk/debug/app-debug.apk "$APP_PATH"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-combine-${{ env.VERSION }}
          path: ${{ env.APP_PATH }}
          if-no-files-found: error
