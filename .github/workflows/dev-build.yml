name: DEV snapshot
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - name: Test
        run: bash ./gradlew :ext:check --no-daemon --stacktrace --info
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Combine-Test-Reports-${{ github.run_number }}
          path: |
            ext/build/test-results/test/**
            ext/build/reports/tests/test/**
          if-no-files-found: warn
      - name: Build debug extension
        run: bash ./gradlew :app:assembleDebug --no-daemon -PextVersionName=dev-${{ github.run_number }} -PextUpdateUrl=
      - name: Package extension
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Combine-DEV.eapk
      - uses: actions/upload-artifact@v4
        with:
          name: Combine-DEV-${{ github.run_number }}
          path: dist/*.eapk
          if-no-files-found: error
